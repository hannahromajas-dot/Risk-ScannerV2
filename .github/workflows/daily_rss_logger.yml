name: Daily RSS News Logger

on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically every night at midnight UTC
  workflow_dispatch: # Allows you to trigger it manually from the GitHub Actions tab

jobs:
  log-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas feedparser scikit-learn

      - name: Run RSS Logger Script
        run: python daily_logger.py

      - name: Commit and push changes safely
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add historical_news.csv
          
          # This line checks if there are actual changes before committing.
          # If no changes were made, it exits cleanly with success (0) instead of failing (1).
          git diff --staged --quiet || git commit -m "Automated daily news log update [skip ci]"
          git push
