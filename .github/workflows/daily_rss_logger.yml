name: Daily Google News RSS Archiver

on:
  schedule:
    # Runs every day at 00:00 UTC (Midnight)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger testing from GitHub Actions tab

jobs:
  archive-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn feedparser

      - name: Execute Daily RSS Archiver Script
        run: python daily_logger.py

      - name: Commit and Push Updated Historical CSV
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add historical_news.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-archive: Daily RSS headlines appended" && git push)

